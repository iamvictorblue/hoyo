# XcodeGen spec — run `xcodegen` in this folder to generate Hoyo.xcodeproj
# (brew install xcodegen)
name: Hoyo
options:
  bundleIdPrefix: com.victorhernandez
  deploymentTarget:
    iOS: "16.0"
targets:
  Hoyo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ¡HOYO!
        # Named colour rather than an empty dict: the default launch surface is
        # white, which flashes hard before the night coastline appears.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  HoyoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Hoyo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
schemes:
  Hoyo:
    build:
      targets:
        Hoyo: all
        HoyoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HoyoTests
